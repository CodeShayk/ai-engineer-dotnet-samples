<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Assist - Streaming</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #333; }
    h1 { color: #0078D4; font-size: 1.4rem; }
    #log { border: 1px solid #ccc; border-radius: 4px; padding: 1rem; min-height: 12rem; white-space: pre-wrap; background: #fafafa; }
    .user { color: #0078D4; font-weight: 600; margin-top: .75rem; }
    .assistant { margin-bottom: .75rem; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .5rem; border: 1px solid #999; border-radius: 4px; }
    button { padding: .5rem 1rem; background: #0078D4; color: white; border: 0; border-radius: 4px; cursor: pointer; }
    .meta { color: #666; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Northwind Assist (Chapter 4.4: streaming)</h1>
  <p class="meta">Text appears as the model generates it. Time to first token is shown after each answer.</p>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask about delivery, returns or products..." />
    <button type="submit">Send</button>
  </form>

  <script>
    const history = [];
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      history.push({ role: 'user', content: text });
      log.insertAdjacentHTML('beforeend', `<div class="user"></div>`);
      log.lastElementChild.textContent = 'You: ' + text;
      const answer = document.createElement('div');
      answer.className = 'assistant';
      log.appendChild(answer);

      const started = performance.now();
      let firstTokenAt = null;
      let full = '';

      // EventSource only supports GET, so read the POST response body as a stream instead.
      const response = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // Server-Sent Events are separated by a blank line.
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) >= 0) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);

          const data = rawEvent.split('\n')
            .filter(line => line.startsWith('data:'))
            .map(line => line.slice(5).replace(/^ /, ''))
            .join('\n');

          if (data) {
            firstTokenAt ??= performance.now();
            full += data;
            answer.textContent = full;   // textContent, never innerHTML: model output is untrusted.
          }
        }
      }

      history.push({ role: 'assistant', content: full });
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `Time to first token: ${((firstTokenAt - started) / 1000).toFixed(2)} s, total: ${((performance.now() - started) / 1000).toFixed(2)} s`;
      log.appendChild(meta);
    });
  </script>
</body>
</html>
